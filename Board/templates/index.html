<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Match Board</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
        }

        .processed {
            background-color: #ddd;
        }
    </style>
</head>
<body>
<h1>Upcoming Matches Board</h1>
<button onclick="refreshBoard()">Refresh</button>
<br/><br/>
<label for="baseBet">Base Bet Amount:</label>
<input type="number" id="baseBet" value="100" min="1" step="10" />
<table id="matchesTable">
    <thead>
    <tr>
        <th>Match ID</th>
        <th>Country</th>
        <th>Competition</th>
        <th>Season</th>
        <th>Teams</th>
        <th>Date/Time</th>
        <th>Prediction</th>
        <th>Odds</th>
        <th>Recommended Bets</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Matches will be dynamically inserted here -->
    </tbody>
</table>

<h2>Processed Matches (Upcoming)</h2>
<table id="processedTable">
    <thead>
    <tr>
        <th>Match ID</th>
        <th>Country</th>
        <th>Competition</th>
        <th>Season</th>
        <th>Teams</th>
        <th>Date/Time</th>
        <th>Prediction</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- Processed matches will be dynamically inserted here -->
    </tbody>
</table>

<script>
    let selectedIndex = 0;  // currently selected match row
    let matchRows = [];  // references to all match rows

    async function refreshBoard() {
        const response = await fetch('/refresh');
        const matches = await response.json();

        console.log("🔄 [DEBUG] Refreshed matches:", matches);

        const tableBody = document.querySelector('#matchesTable tbody');
        tableBody.innerHTML = '';
        matchRows = [];  // clear and refill match rows list

        // Sort matches by datetime ascending
        matches.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

        matches.forEach(match => {
            const row = document.createElement('tr');
            row.id = `match_${match.match_id}`;
            row.dataset.matchId = match.match_id;
            row.classList.add("match-row");

            row.innerHTML = `
          <td>${match.match_id}</td>
          <td>${match.country}</td>
          <td style="background-color: ${match.color}">${match.comp_name}</td>
          <td>${match.season}</td>
          <td>${match.home_team} -- ${match.away_team}</td>
          <td>${new Date(match.datetime).toLocaleString()}</td>
          <td>${match.prediction}</td>
          <td>
            <input type="number" step="0.01" id="odds_yes_${match.match_id}" placeholder="Under 2.5 - Yes" />
            <input type="number" step="0.01" id="odds_no_${match.match_id}" placeholder="Under 2.5 - No" />
          </td>
          <td id="bet_fraction_${match.match_id}">-</td>
          <td>
            <button onclick="triggerBet('${match.match_id}')" id="trigger_${match.match_id}">Trigger</button>
            <button onclick="markMatch('${match.match_id}')">Mark</button>
          </td>
        `;
            tableBody.appendChild(row);
            matchRows.push(row);
        });

        highlightSelectedRow();  // first row selected by default
        await refreshProcessedMatches();  // fetch processed matches + update processedTable
    }

    async function refreshProcessedMatches() {
        const response = await fetch('/processed_matches');
        const matches = await response.json();

        console.log("📋 [DEBUG] Processed matches:", matches);

        const tableBody = document.querySelector('#processedTable tbody');
        tableBody.innerHTML = '';

        matches.sort((a, b) => new Date(a.datetime) - new Date(b.datetime));

        matches.forEach(match => {
            const row = document.createElement('tr');
            row.id = `processed_${match.match_id}`;
            row.classList.add('processed');

            row.innerHTML = `
          <td>${match.match_id}</td>
          <td>${match.country}</td>
          <td style="background-color: ${match.color}">${match.comp_name}</td>
          <td>${match.season}</td>
          <td>${match.home_team} vs ${match.away_team}</td>
          <td>${new Date(match.datetime).toLocaleString()}</td>
          <td>${match.prediction}</td>
          <td>
            <button onclick="markMatch('${match.match_id}')">Unmark</button>
          </td>
        `;
            tableBody.appendChild(row);
        });
    }


    async function triggerBet(match_id) {
        const oddsYesInput = document.getElementById('odds_yes_' + match_id);
        const oddsNoInput = document.getElementById('odds_no_' + match_id);
        const baseBetInput = document.getElementById('baseBet');

        const oddsYes = parseFloat(oddsYesInput.value);
        const oddsNo = parseFloat(oddsNoInput.value);
        const baseBet = parseFloat(baseBetInput.value);

        if (isNaN(oddsYes) || isNaN(oddsNo) || isNaN(baseBet) || baseBet <= 0) {
            alert("Please enter valid odds and base bet amount.");
            return;
        }

        const response = await fetch(`/trigger/${match_id.toString()}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({odds_yes: oddsYes, odds_no: oddsNo, base_bet: baseBet})
        });

        if (!response.ok) {
            alert("Error processing bet recommendation.");
            return;
        }

        const result = await response.json();

        // Update the Recommended Bet column
        const betFractionCell = document.getElementById(`bet_fraction_${match_id}`);
        betFractionCell.innerHTML = `Yes: ${result.recommended_bet_fraction_yes.toFixed(2)}<br>No: ${result.recommended_bet_fraction_no.toFixed(2)}`;

        // Store both recommended bet values and odds in the row's dataset for later use
        const row = document.getElementById(`match_${match_id}`);
        row.dataset.recommendedBetYes = result.recommended_bet_fraction_yes;
        row.dataset.recommendedBetNo = result.recommended_bet_fraction_no;
        row.dataset.oddsYes = oddsYes;
        row.dataset.oddsNo = oddsNo;
        row.dataset.baseBet = baseBet;
    }


    async function markMatch(match_id) {
        console.log(`🔘 [DEBUG] Marking match ${match_id}`);
        const row = document.getElementById(`match_${match_id}`);

        // Read stored values from the row's dataset
        const recommendedBetYes = row ? row.dataset.recommendedBetYes : null;
        const recommendedBetNo = row ? row.dataset.recommendedBetNo : null;
        const oddsYes = row ? row.dataset.oddsYes : null;
        const oddsNo = row ? row.dataset.oddsNo : null;
        const baseBet = row ? row.dataset.baseBet : 100;

        const payload = {
            odds_yes: oddsYes ? parseFloat(oddsYes) : null,
            odds_no: oddsNo ? parseFloat(oddsNo) : null,
            recommended_bet_yes: recommendedBetYes ? parseFloat(recommendedBetYes) : null,
            recommended_bet_no: recommendedBetNo ? parseFloat(recommendedBetNo) : null,
            base_bet: parseFloat(baseBet)
        };

         const response = await fetch(`/mark/${match_id.toString()}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });

        if (!response.ok) {
            alert("Error marking match.");
            return;
        }

        const result = await response.json();
        console.log(`✅ [DEBUG] Match ${match_id} marked as ${result.processed ? "processed" : "unprocessed"}`);

        await refreshBoard();  // refresh both tables
    }

    function highlightSelectedRow() {
        matchRows.forEach((row, index) => {
            row.style.backgroundColor = index === selectedIndex ? "#b3ffb3" : "";
        });
    }

    function selectNextRow() {
        selectedIndex = (selectedIndex + 1) % matchRows.length;
        highlightSelectedRow();  // "Tab"
    }

    function selectPreviousRow() {
        selectedIndex = (selectedIndex - 1 + matchRows.length) % matchRows.length;
        highlightSelectedRow();  // "Shift + Tab"
    }

    function focusOddsYes() {
        const matchId = matchRows[selectedIndex].dataset.matchId;
        const input = document.getElementById(`odds_yes_${matchId}`);
        if (input) {
            input.focus();
            input.select();
        }  // focus the "Under 2.5 - Yes" odds box in selected row
    }

    function focusOddsNo() {
        const matchId = matchRows[selectedIndex].dataset.matchId;
        const input = document.getElementById(`odds_no_${matchId}`);
        if (input) {
            input.focus();
            input.select();
        }  // focus the "Under 2.5 - No" odds box in selected row
    }

    function triggerSelectedBet() {
        event.preventDefault(); // prevent default key behavior
        const matchId = matchRows[selectedIndex].dataset.matchId;
        const button = document.getElementById(`trigger_${matchId}`);
        if (button) {
            console.log(`🚀 [DEBUG] Triggering bet for match ${matchId}`);
            button.click();
        }  // Trigger btn
    }

    // Key presses handling
    document.addEventListener("keydown", function(event) {
        if (event.key === "Tab") {
            event.preventDefault();  // prevent default key behavior
            if (event.shiftKey) {
                selectPreviousRow();  // "Shift + Tab" moves up
            } else {
                selectNextRow();  // "Tab" moves down
            }
        } else if (event.key === "q" || event.key === "Q") {
            focusOddsYes();  // "Q" focuses on "Under 2.5 - Yes"
        } else if (event.key === "w" || event.key === "W") {
            focusOddsNo();  // "W" focuses on "Under 2.5 - No"
        } else if (event.key === "Enter") {
            triggerSelectedBet();  // "Enter" triggers the bet
        }
    });

    refreshBoard();  // initial load
</script>
</body>
</html>

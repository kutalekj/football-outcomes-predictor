[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-outcomes-predictor"
version = "0.1.0"
description = "Deep learning pipeline to predict football match outcomes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jakub Kutálek" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "requests>=2.31"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "black>=24.3.0",
  "isort>=5.13.2",
  "flake8>=6.1.0",
  "mypy>=1.7.0",
  "pre-commit>=3.6.0",
  "python-dotenv>=1.0.1"
]
tf = ["tensorflow>=2.13"]
firebase = ["firebase-admin>=6.5.0"]
scrape = ["selenium>=4.12"]

[project.scripts]
fop-main = "football_outcomes.cli.main:main"
fop-app  = "football_outcomes.cli.app:main"
fop-train-ann = "football_outcomes.training.train_ann:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["football_outcomes*"]

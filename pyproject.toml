[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-outcomes-predictor"
version = "0.1.0"
description = "A Deep Learning Framework for Predicting Football Match Outcomes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jiří Kutálek" }]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.65",
  "requests>=2.31"]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "black>=24.3.0",
  "isort>=5.13.2",
  "flake8>=6.1.0",
  "mypy>=1.7.0",
  "pre-commit>=3.6.0",
  "protobuf>=3.9.2,<3.20",  # prevously \"protobuf>=3.20.3,<5\",
  "python-dotenv>=1.0.1"]
firebase = ["firebase-admin>=6.5.0"]
scrape = ["selenium>=4.12"]
# tf = ["tensorflow>=2.13"]

[project.scripts]
fop-main = "football_outcomes.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["football_outcomes*"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203","W503"]
per-file-ignores = [
    "src/football_outcomes/config/settings.py:E501",
    "src/football_outcomes/data/match.py:E501"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"
line_length = 120

[tool.poetry]
name = "football-outcomes-predictor"
version = "0.1.0"
# ...
packages = [{ include = "football_outcomes", from = "src" }]

[tool.poetry.scripts]
fop-main = "football_outcomes.cli.main:main"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "<1.24"
protobuf = "3.19.6"
